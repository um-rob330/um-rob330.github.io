# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: "ROB 330: Localization, Mapping, and Navigation"
description: "Junior-level course on full-stack autonomous navigation and mapping for mobile robots: odometry, sensor modeling, visual odometry, path planning, and SLAM — implemented on hardware."
lang: en

# ---------------------------------------------------------------------------
# SEMESTER — the only block to change when rolling over to a new offering.
# `bin/new-semester` rewrites it for you; see the repo README.
#
# `baseurl` MUST equal "/" + this directory's name. bin/build refuses to build
# if they disagree, because a mismatch produces a site whose every internal
# link 404s.
# ---------------------------------------------------------------------------
semester:
  code: "f26"          # directory name and URL segment -> rob330.github.io/f26/
  label: "Fall 2026"   # displayed everywhere the term is named
  term: "Fall"
  year: 2026

url: "https://rob330.github.io"
baseurl: "/f26"

# ---------------------------------------------------------------------------
# Course metadata — surfaced on the home page and in page headers
# ---------------------------------------------------------------------------
course:
  code: "ROB 330"
  name: "Localization, Mapping, and Navigation"
  institution: "The University of Michigan"

  # Official course-catalog description, verbatim. Rendered on the home page and
  # at the top of the syllabus — stated once here so the two cannot drift apart.
  description_catalog: >
    Development of full-stack autonomous navigation and mapping for mobile
    robots. Topics include dead reckoning from odometry, sensor modeling of
    LIDAR and cameras, visual odometry, path planning, and simultaneous
    localization and mapping (SLAM). Course topics will be implemented in
    hardware.

  # The term is NOT repeated here — it lives in `semester.label` above, so it is
  # stated exactly once in this file. Reference it as {{ site.semester.label }}.
  credits: 4
  meeting_times: "MoWe 10:30AM–12:00PM"
  location: "1050 FMCRB"
  # Canvas course URL. Referenced by pages as {{ site.course.lms_url }}; keep it
  # in sync with the "Canvas" entry under aux_links below (config values can't
  # reference each other, so that one has to repeat the literal URL).
  # NOTE: this is the U-M Canvas landing page, not the ROB 330 course. Students
  # following it have to find the course themselves. Once the course site is
  # published, replace with its direct URL (…/courses/<id>) here and below.
  lms_url: "https://canvas.it.umich.edu/"

  # Piazza course page. NOTE: the URL embeds the term ("fall2026") and the course
  # instance, so it changes on every rollover — that is why it lives here rather
  # than being written into each page. Keep it in sync with the "Piazza" entry
  # under aux_links below.
  piazza_url: "https://piazza.com/umich/fall2026/rob330fa2026/home"

  # Home-page banner. Drop the file in assets/images/ and set the path here,
  # e.g. "/assets/images/banner.gif". Empty -> a labeled placeholder strip.
  banner: ""
  # Optional still frame shown instead of the animation for visitors whose OS
  # is set to "reduce motion". Leave "" if the banner isn't animated.
  banner_static: ""
  # Alt text. Leave "" if the banner is purely decorative — that is the correct
  # choice for a decorative image, and screen readers will skip it.
  banner_alt: ""

  # Public Google Calendar ID for office hours (see README for how to find it).
  # Example: "c_1a2b3c4d5e@group.calendar.google.com" or "you@umich.edu"
  calendar_id: "c_32de078b424134de732ba1d0a9218c212fcf9b685071f1a68085d1138052fb4b@group.calendar.google.com"
  # IANA zone, passed to the embed as ctz. America/Detroit and America/New_York
  # are the same offset and DST rules; the calendar itself declares New_York.
  calendar_timezone: "America/Detroit"
  # What students actually read. IANA identifiers are precise but unfriendly, so
  # the pages display this instead of "America/Detroit".
  calendar_timezone_label: "Eastern Time (Ann Arbor)"

# Staff (instructor, GSI, IAs) live in _data/staff.yml, not here — that file
# drives the course-staff cards on the home page.

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
# Just the Docs 0.10 still uses darken()/map-get(), which Dart Sass deprecates.
# quiet_deps silences warnings originating inside imported dependencies, so real
# warnings from our own _sass/ files stay visible instead of being buried in ~90
# lines of noise per build.
sass:
  quiet_deps: true
  # The theme's own root stylesheets use @import, which Dart Sass 3 will remove.
  # Nothing here can fix that — it's upstream — so silence just that one class of
  # warning. Drop this line after upgrading to a Just the Docs release that has
  # migrated to @use, so the reminder comes back if it's ever ours to fix.
  silence_deprecations:
    - import

# theme: just-the-docs
# If you'd rather use GitHub Pages' built-in (classic) Jekyll build instead of
# the Actions workflow, delete the `theme:` line above and uncomment this:
# remote_theme: just-the-docs/just-the-docs

 # Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-last-modified-at

remote_theme: pmarsceill/just-the-docs

color_scheme: umich          # custom U-M maize & blue scheme (_sass/color_schemes/umich.scss)
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Header links, top right. Ordered by how often a student needs them.
# Keep "Canvas" identical to course.lms_url above (config values can't reference
# each other, so the URL is unavoidably written twice).
aux_links:
  "Canvas": "https://canvas.it.umich.edu/"
  "Piazza": "https://piazza.com/umich/fall2026/rob330fa2026/home"
  "Google Drive": "https://drive.google.com/drive/folders/1ZYIDd03sRtkSddDVlESq2QoCIzSGEajw?usp=drive_link"
  # TODO: label says GitLab but the URL is still the GitHub site repo. Replace
  # with the real GitLab URL (U-M GitLab is usually gitlab.umich.edu or
  # gitlab.eecs.umich.edu), or rename the label back to "GitHub repo".
  "GitLab": "https://github.com/rob330/rob330.github.io"
# Canvas moved to aux_links (header) above. Leaving it here too would put the
# same link in the header and the sidebar on every page. Add sidebar links here
# only for destinations that aren't already in aux_links.
nav_external_links: []

# The footer is _includes/footer_custom.html, not a `footer_content` string here:
# config values can't run Liquid, and the footer needs {{ site.semester.label }}.
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# ---------------------------------------------------------------------------
# Callouts — use in Markdown as:  {: .deadline } / {: .note } / etc.
# ---------------------------------------------------------------------------
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  deadline:
    title: Deadline
    color: red
  warning:
    title: Warning
    color: yellow
  policy:
    title: Policy
    color: purple

# ---------------------------------------------------------------------------
# Collections — lecture notes and checkpoints each get their own folder
# ---------------------------------------------------------------------------
# REQUIRED for a course site. Jekyll defaults to future: false, which silently
# refuses to WRITE any collection document whose `date:` is in the future — the
# page still appears in the nav and the schedule links to it, but the file is
# never generated and the link 404s. Since lecture pages are dated when the
# lecture happens, every upcoming lecture would be a dead link without this.
future: true

# Checkpoints are NOT a collection: they are regular pages under checkpoints/
# with `parent: Checkpoints`. That gives a clickable landing page at
# /f26/checkpoints/ with the individual checkpoints nested beneath it — a
# collection's nav group is only a heading, so an overview page and a collection
# group of the same name would appear twice in the sidebar.
collections:
  lectures:
    output: true
    permalink: /lectures/:path/

just_the_docs:
  collections:
    lectures:
      name: Lecture Notes
      nav_fold: true

defaults:
  - scope:
      path: ""
      type: lectures
    values:
      layout: default

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
