# ---------------------------------------------------------------------------
# Recurring office hours, shown as a table on /office-hours/ above the live
# calendar. The Google Calendar embed is the source of truth for one-off changes
# and cancellations; this table is the at-a-glance weekly version.
#
# `staff` is an `id` from _data/staff.yml. The person's NAME and ROLE are looked
# up from there, so they cannot drift out of sync with the home-page cards.
# Only the schedule itself lives in this file.
#
# bin/build fails the build if an id here doesn't exist in staff.yml.
#
# One person may appear more than once (e.g. two blocks on different days) —
# just add another row with the same id.
#
# For hours that belong to a room/service rather than a specific person (e.g.
# a drop-in help desk covering several staff), use `who:` instead of `staff:`
# — it's shown as literal text and skips the staff.yml lookup and Role column.
# ---------------------------------------------------------------------------

