# ---------------------------------------------------------------------------
# Site identity  — TODO: replace the placeholders below
# ---------------------------------------------------------------------------
title: "ROB 330: Localization, Mapping, and Navigation"
description: "Course website: syllabus, schedule, lecture notes, and assignments."
lang: en

# If your repo is named  <username>.github.io       -> baseurl: ""
# If your repo is named  <username>/my-course       -> baseurl: "/my-course"
url: "https://um-rob330.github.io"
baseurl: ""

# ---------------------------------------------------------------------------
# Course metadata — surfaced on the home page and in page headers
# ---------------------------------------------------------------------------
course:
  code: "ROB 330"
  name: "Localization, Mapping, and Navigation"
  term: "Fall 2026"
  credits: 4
  meeting_times: "Mon./Wed. 10:30AM–12:00PM"
  location: "FMCRB 1050"
  instructor: "Xiaoxiao Du"
  instructor_email: "xiaodu[at]umich.edu"
  # Public Google Calendar ID for office hours (see README for how to find it).
  # Example: "c_1a2b3c4d5e@group.calendar.google.com" or "you@example.edu"
  calendar_id: "c_32de078b424134de732ba1d0a9218c212fcf9b685071f1a68085d1138052fb4b@group.calendar.google.com"
  calendar_timezone: "America/New_York"

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
# theme: just-the-docs
 # Build settings
plugins:
  - jekyll-remote-theme
  - jekyll-last-modified-at

remote_theme: pmarsceill/just-the-docs
# If you'd rather use GitHub Pages' built-in (classic) Jekyll build instead of
# the Actions workflow, delete the `theme:` line above and uncomment this:
# remote_theme: just-the-docs/just-the-docs

color_scheme: light          # "light", "dark", or the custom "course" scheme
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Top-right links in the header
aux_links:
  "GitLab repo": "https://github.com/USERNAME/REPO"
nav_external_links:
  - title: "Course Google Drive"
    url: "https://drive.google.com/drive/folders/1ZYIDd03sRtkSddDVlESq2QoCIzSGEajw?usp=drive_link"
    hide_icon: false

footer_content: 'Course materials © 2026 Xiaoxiao Du. Site built with <a href="https://jekyllrb.com">Jekyll</a> and <a href="https://just-the-docs.com">Just the Docs</a>.'
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y"

# ---------------------------------------------------------------------------
# Callouts — use in Markdown as:  {: .deadline } / {: .note } / etc.
# ---------------------------------------------------------------------------
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  deadline:
    title: Deadline
    color: red
  warning:
    title: Warning
    color: yellow
  policy:
    title: Policy
    color: purple

# ---------------------------------------------------------------------------
# Collections — lecture notes and assignments each get their own folder
# ---------------------------------------------------------------------------
collections:
  lectures:
    output: true
    permalink: /lectures/:path/
  assignments:
    output: true
    permalink: /assignments/:path/

just_the_docs:
  collections:
    lectures:
      name: Lecture Notes
      nav_fold: true
    assignments:
      name: Assignments
      nav_fold: true

defaults:
  - scope:
      path: ""
      type: lectures
    values:
      layout: default
  - scope:
      path: ""
      type: assignments
    values:
      layout: default

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
